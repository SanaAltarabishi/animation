allprojects {
repositories {
    google()
    maven { url "https://maven.aliyun.com/repository/public" }  // Alternative mirror
    maven { url "https://jitpack.io" }  // Another useful mirror
    mavenCentral()
}
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
